name: supplier-mail-triage

# Geheimnisse liegen als Dateien unter /run/secrets und nicht in der Umgebung der Container.
# Die Workflows lesen Einstellungen über $env. Stünden dort Passwörter oder der Encryption Key,
# könnte jeder Node sie auslesen und damit alle gespeicherten Zugangsdaten entschlüsseln.
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  n8n_encryption_key:
    environment: N8N_ENCRYPTION_KEY
  webhook_token:
    environment: WEBHOOK_TOKEN
  review_password:
    environment: REVIEW_PASSWORD

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  GENERIC_TIMEZONE: Europe/Berlin
  TZ: Europe/Berlin
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  # Die Workflows lesen Modell, Ollama-URL und Schwelle aus der Umgebung ($env). Hier stehen nur nicht-geheime Werte.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  OLLAMA_MODEL: ${OLLAMA_MODEL}
  KONFIDENZ_SCHWELLE: ${KONFIDENZ_SCHWELLE}

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:2.45.7
  environment: *n8n-env
  secrets: [postgres_password, n8n_encryption_key]
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: n8n
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    # Kein Port nach außen: Zugriff nur aus dem Docker-Netz, zum Nachsehen per "docker compose exec postgres psql"
    healthcheck:
      # -h 127.0.0.1: während des Init-Skripts lauscht Postgres nur auf dem Socket, so gilt es erst danach als bereit
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d triage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Einmal-Container: spielt Zugangsdaten und Workflows aus dem Repo ein und veröffentlicht sie.
  # Das Repo ist damit die Quelle der Wahrheit (Änderungen aus der UI mit scripts/export_workflows.py zurückholen).
  # Nur dieser Container bekommt alle Geheimnisse, weil er die Credential-Vorlage füllt.
  n8n-import:
    <<: *n8n
    environment:
      <<: *n8n-env
      POSTGRES_USER: ${POSTGRES_USER}
      REVIEW_USER: ${REVIEW_USER}
    secrets: [postgres_password, n8n_encryption_key, webhook_token, review_password]
    entrypoint: /bin/sh
    command: /scripts/n8n_import.sh
    volumes:
      - ./workflows:/workflows:ro
      - ./credentials:/credentials:ro
      - ./scripts/n8n_import.sh:/scripts/n8n_import.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    <<: *n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully

  # Optional: Ollama im Container mit NVIDIA-GPU. Start mit: docker compose --profile ollama up -d
  # Dann in .env OLLAMA_BASE_URL=http://ollama:11434 setzen.
  ollama:
    image: ollama/ollama:0.40.5
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
