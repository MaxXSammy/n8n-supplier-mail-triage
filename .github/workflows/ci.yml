name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JSON-Dateien gültig
        run: for f in workflows/*.json mails/*.json eval/*.json schema/*.json credentials/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done

      - name: Schema im Workflow synchron mit schema/
        run: python scripts/check_schema_sync.py

      - name: Python-Skripte kompilieren
        run: python -m py_compile scripts/*.py

      - name: docker-compose gültig
        run: cp .env.example .env && docker compose config --quiet
